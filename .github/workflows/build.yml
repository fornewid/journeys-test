name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Validate plugin
        working-directory: journeys-test-plugin
        run: ./gradlew validatePlugins publishToMavenLocal --stacktrace

      - name: Run sample journey (device-free demo agent)
        run: ./gradlew :sample:journeysTest --stacktrace
