name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Unit + TestKit tests cover the paths a passing journey never exercises: the agent
      # exiting non-zero, timing out, leaving children behind, or reporting FAILED.
      # The sample needs a device and a real agent, so it is not run here.
      - name: Test and validate plugin
        working-directory: journeys-test-plugin
        run: ./gradlew spotlessCheck test validatePlugins publishToMavenLocal --stacktrace

      - name: Assemble the sample app
        run: ./gradlew :sample:assembleDebug --stacktrace
