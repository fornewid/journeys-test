name: Journeys

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'journeys-test-plugin/**'
      - 'sample/**'
      - '.github/workflows/journeys.yml'

jobs:
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Without this the emulator falls back to software rendering and takes minutes to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # With ANTHROPIC_API_KEY set the agent runs for real and the journeys are worth
      # something; without it only the judging is stubbed, and the stub says so in every
      # verdict it writes, so a report from this job cannot be mistaken for a tested app.
      # Either way the emulator, the install, the task and the report run for real.
      # JOURNEY_AGENT_CMD overrides the command when the agent is not Claude Code.
      - name: Pick the agent
        id: agent
        env:
          AGENT: ${{ secrets.JOURNEY_AGENT_CMD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$AGENT" ]; then
            echo "cmd=$AGENT" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            npm install -g @anthropic-ai/claude-code
            # No android CLI on Linux — it ships for macOS on Apple silicon only — so the
            # agent works through adb, which the built-in prompt tells it to do.
            echo "cmd=claude --no-session-persistence --allowedTools 'Bash(adb *)' -p" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANTHROPIC_API_KEY secret. Running with the stub agent, which checks the plumbing but does not drive the app."
            echo "cmd=bash $GITHUB_WORKSPACE/.github/stub-agent.sh" >> "$GITHUB_OUTPUT"
          fi

      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew :sample:journeysTest -PjourneyAgentCommand="${{ steps.agent.outputs.cmd }}" --stacktrace

      - name: Collect the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-results
          path: |
            sample/build/journey-results/*.xml
            sample/build/journeys/report.html
