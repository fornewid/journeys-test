name: Journeys

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'journeys-test-plugin/**'
      - 'sample/**'
      - '.github/workflows/journeys.yml'

jobs:
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Without this the emulator falls back to software rendering and takes minutes to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A journey needs an agent, and an agent needs credentials this repository does not
      # have. So the emulator, the APK install, the task, the JUnit XML and its collection
      # are all exercised for real, and only the judging is stubbed — the stub says so in
      # every verdict it writes, so a report from this job cannot be mistaken for a tested
      # app. Set the JOURNEY_AGENT_CMD secret to run the real thing instead.
      - name: Pick the agent
        id: agent
        env:
          AGENT: ${{ secrets.JOURNEY_AGENT_CMD }}
        run: |
          if [ -n "$AGENT" ]; then
            echo "cmd=$AGENT" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No JOURNEY_AGENT_CMD secret. Running with the stub agent, which checks the plumbing but does not drive the app."
            echo "cmd=bash $GITHUB_WORKSPACE/.github/stub-agent.sh" >> "$GITHUB_OUTPUT"
          fi

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew :sample:journeysTest -PjourneyAgentCommand="${{ steps.agent.outputs.cmd }}" --stacktrace

      - name: Collect the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-results
          path: |
            sample/build/journey-results/*.xml
            sample/build/journeys/report.html
