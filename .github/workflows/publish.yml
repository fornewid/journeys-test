name: Publish

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'fornewid/journeys-test'
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags and history, so the release notes can be a diff against the last release.
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          VERSION=$(grep 'VERSION_NAME=' journeys-test-plugin/gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Copy CI gradle.properties
        if: ${{ !endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 17
        if: ${{ !endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        if: ${{ !endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        uses: gradle/actions/setup-gradle@v5

      - name: Publish to Maven Central
        if: ${{ !endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        working-directory: journeys-test-plugin
        run: ./gradlew publishToMavenCentral --no-parallel --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}

      - name: Publish to Gradle Plugin Portal
        if: ${{ !endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        working-directory: journeys-test-plugin
        run: ./gradlew publishPlugins --no-parallel --stacktrace
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}

      - name: Create git tag
        if: ${{ !endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      # Written here rather than by a workflow watching for the tag: a tag pushed with the default
      # GITHUB_TOKEN does not start another workflow run, so a tag-triggered release would never
      # fire. Notes come from the commit log rather than merged pull requests, because most of this
      # repository's history lands on main directly.
      - name: Create GitHub Release
        if: ${{ !endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREVIOUS=$(git tag --sort=-v:refname | grep -vFx "$VERSION" | head -1)
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --invert-grep --grep='^Prepare next development version' \
                --pretty='- %s' "$PREVIOUS..$VERSION"
              echo
              echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$PREVIOUS...$VERSION"
            else
              git log --no-merges --invert-grep --grep='^Prepare next development version' \
                --pretty='- %s' "$VERSION"
            fi
          } > release-notes.md
          gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md
          rm release-notes.md

      - name: Bump to next SNAPSHOT version
        if: ${{ !endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEXT_VERSION="$major.$minor.$((patch + 1))-SNAPSHOT"
          sed -i "s/VERSION_NAME=.*/VERSION_NAME=$NEXT_VERSION/" journeys-test-plugin/gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journeys-test-plugin/gradle.properties
          git commit -m "Prepare next development version $NEXT_VERSION [skip ci]"
          git push
